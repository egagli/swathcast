name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: also run the live API smoke tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pixi
        with:
          environment: lint
      - run: pixi run -e lint ruff check src tests
      - run: pixi run -e lint ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pixi
        with:
          environment: default
      - name: Unit tests (offline, recorded fixtures) + site data-contract check
        run: pixi run pytest
      - name: Live API smoke tests
        if: github.event_name == 'workflow_dispatch' && inputs.live
        run: pixi run pytest -m live

  browser:
    # The map in Chromium (tests/test_site_browser.py): a synthetic site, the
    # catalogues stubbed, the JavaScript libraries from their CDNs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e . pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests
        env:
          SWATHCAST_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_site_browser.py

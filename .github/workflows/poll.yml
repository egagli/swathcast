name: poll

# Hourly latency poller. Reads the tracking table from the `data` branch,
# looks up every open granule at every source, and pushes the table back.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pixi
        with:
          environment: poll
      - uses: ./.github/actions/data-branch
      - name: Poll sources
        id: poll
        env:
          # NISAR S-band at ISRO's Bhoonidhi needs a login; without these
          # repository secrets that mission is skipped.
          BHOONIDHI_USER_ID: ${{ secrets.BHOONIDHI_USER_ID }}
          BHOONIDHI_PASSWORD: ${{ secrets.BHOONIDHI_PASSWORD }}
        run: |
          set +e
          pixi run -e poll swathcast poll --data-dir data
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Exact extents of NISAR and OPERA browse images (never fails the job)
        env:
          # an Earthdata login: the extents are in files behind it; without
          # these repository secrets the map places those previews approximately
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: pixi run -e poll swathcast extents --data-dir data || true
      - name: Refresh orbital elements for the map (every 6 h, never fails the job)
        run: pixi run -e poll swathcast tle --output data/tle.json --max-age-hours 6 || true
      - name: Push data branch
        if: always()
        uses: ./.github/actions/push-data
        with:
          message: "data: poll ${{ github.run_id }}"
      # Is each satellite still delivering? A source can answer "nothing new"
      # because its satellite stopped (or its products moved): health.json
      # cannot see that. One issue lists the flagged platforms; it is
      # edited and commented on only when that list changes, and closed when
      # none is left (satellites.py; the map reads the same check).
      - name: Open, update or close the satellite-status issue (never fails the job)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sched=(); if [ -d data/schedule ]; then sched=(--schedule-dir data/schedule); fi
          marker=$(pixi run -e poll swathcast satellites --data-dir data "${sched[@]}" --issue-body "$RUNNER_TEMP/sat.md" --run-url "$RUN_URL" | tail -n 1)
          echo "$marker"
          case "$marker" in "flagged: "*) ;; *) echo "::warning::satellite check did not run"; exit 0 ;; esac
          gh label create satellite-status --color 5319e7 --description "Opened by the poll workflow: a satellite (or one of its data streams) went silent" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label satellite-status --state open --json number --jq '.[0].number')
          if [ "$marker" != "flagged: " ]; then
            title="Satellite status: ${marker#flagged: }"
            if [ -z "$existing" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label satellite-status --body-file "$RUNNER_TEMP/sat.md"
            else
              old=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | head -n 1)
              if [ "$old" != "<!-- $marker -->" ]; then
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/sat.md"
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Changed: ${marker#flagged: } ($RUN_URL)"
              fi
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Every satellite is delivering again: $RUN_URL"
          fi
      - name: Fail if the poller crashed, every source failed, or one has failed for over 24 h
        if: steps.poll.outputs.code != '0'
        run: |
          echo "::error::poller exit code ${{ steps.poll.outputs.code }} (1 = the poller crashed, see the Poll sources step; 2 = all sources failed; 3 = a source failing > 24 h); data/health.json follows"
          cat data/health.json
          exit 1

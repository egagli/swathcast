name: schedule

# Daily: regenerate the upcoming-pass schedule from the ESA/USGS/NASA plans.
# A failed scheduled run opens (or comments on) a schedule-failed issue at
# once, rather than waiting for the weekly watchdog; a success closes it.
# A plan file ESA lists but serves as a 404 is skipped (the run still
# succeeds) and opens a plan-file-missing issue, closed once it downloads.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pixi
        with:
          environment: default
      # ESA's Sentinel-2 tiling grid KML (~109 MB) never changes; fetch it once. (Plan
      # files published since the cache was saved are downloaded on each run.)
      - uses: actions/cache@v6
        with:
          path: ~/.cache/swathcast
          key: s2-tiling-grid-20151209-v1
      - name: Build schedule (30 days; plans, grids and orbit timing)
        run: pixi run swathcast schedule --days 30 --output "$RUNNER_TEMP/upcoming_passes.parquet"
      # Check out the data branch only after the slow step, so it is current.
      - uses: ./.github/actions/data-branch
      - name: Stage schedule
        run: |
          mkdir -p data/schedule
          cp "$RUNNER_TEMP/upcoming_passes.parquet" "$RUNNER_TEMP/upcoming_passes.meta.json" data/schedule/
          for f in wrs2_grid.parquet landsat_scenes.parquet s2_grid.parquet s2_tile_passes.parquet sin_grid.parquet modis_tile_passes.parquet viirs_tile_passes.parquet s3_tile_passes.parquet; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" data/schedule/; fi
          done
          cat data/schedule/upcoming_passes.meta.json
      - uses: ./.github/actions/push-data
        with:
          message: "data: schedule ${{ github.run_id }}"
      - name: Open, update or close the plan-file-missing issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          missing=$(jq -r '.missing_plan_files[]? | "- " + .' "$RUNNER_TEMP/upcoming_passes.meta.json")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label plan-file-missing --state open --json number --jq '.[0].number')
          if [ -n "$missing" ]; then
            body=$(printf 'Listed on the acquisition-plans page but a 404 (%s), so the schedule was built without them:\n\n%s\n\nThe older plan files for the same satellite still cover most of the window. This issue closes itself once every listed file downloads.' "$RUN_URL" "$missing")
            gh label create plan-file-missing --color fbca04 --description "Opened by the schedule workflow" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Schedule: ESA plan file(s) missing" --label plan-file-missing --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Every listed plan file downloaded: $RUN_URL"
          fi
      - name: Open or update the schedule-failed issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The daily schedule run failed: $RUN_URL. The site's pass schedule is not being refreshed until a run succeeds; this issue closes itself then."
          gh label create schedule-failed --color d93f0b --description "Opened by the schedule workflow" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label schedule-failed --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Schedule workflow is failing" --label schedule-failed --body "$body"
          fi
      - name: Close the schedule-failed issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label schedule-failed --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Schedule succeeded again: $RUN_URL"
          done

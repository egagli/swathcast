name: notices

# Daily: fetch the agencies' newest notices for the satellites swathcast
# tracks (Copernicus Data Space news, NASA Earthdata alerts, NOAA OSPO
# messages, USGS EROS notifications) into the data branch (notices/), for the
# Satellites page. Notices that may change a satellite's status and that
# src/swathcast/site/platforms.json neither cites nor acknowledges are listed
# in one registry-review issue, edited (and commented on) only when that list
# changes and closed when it is empty. A source that fails is skipped (and
# reported on the page); the job itself fails only if it crashes.
on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pixi
        with:
          environment: poll
      - name: Fetch notices
        id: fetch
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pixi run -e poll swathcast notices --out "$RUNNER_TEMP/notices.json" --issue-body "$RUNNER_TEMP/review.md" --run-url "$RUN_URL" | tee "$RUNNER_TEMP/notices.log"
          echo "marker=$(tail -n 1 "$RUNNER_TEMP/notices.log")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/data-branch
      - name: Stage notices
        run: |
          mkdir -p data/notices
          cp "$RUNNER_TEMP/notices.json" data/notices/
      - uses: ./.github/actions/push-data
        with:
          message: "data: notices ${{ github.run_id }}"
      - name: Open, update or close the registry-review issue
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.fetch.outputs.marker }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$MARKER" in "review: "*) ;; *) echo "::warning::no review marker"; exit 0 ;; esac
          gh label create registry-review --color 0e8a16 --description "Opened by the notices workflow: a notice may change a satellite's status" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label registry-review --state open --json number --jq '.[0].number')
          if [ "$MARKER" != "review: " ]; then
            if [ -z "$existing" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Satellite registry: notices to review" --label registry-review --body-file "$RUNNER_TEMP/review.md"
            else
              old=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | head -n 1)
              if [ "$old" != "<!-- $MARKER -->" ]; then
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review.md"
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "The list changed: $RUN_URL"
              fi
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Nothing left to review: $RUN_URL"
          fi
